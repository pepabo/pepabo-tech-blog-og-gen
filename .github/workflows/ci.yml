name: CI

on:
  pull_request:
  push:
    branches:
      - main

# permissions を明示すると他が none になり contents:read が無いと checkout が落ちる
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd

      - run: npm ci

      - name: Run lockfile-lint
        run: |
          npm install -g lockfile-lint@5.0.1
          npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --allowed-schemes https:

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build
