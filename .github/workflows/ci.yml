name: CI

on:
  pull_request:
  push:
    branches:
      - main

# permissions を明示すると他が none になり contents:read が無いと checkout が落ちる
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0

      - run: npm ci

      - name: Run lockfile-lint
        run: |
          npm install -g lockfile-lint@5.0.1
          npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --allowed-schemes https:

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build
