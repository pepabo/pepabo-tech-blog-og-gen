version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    # automerge を入れるなら 14 に上げる
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    groups:
      # バージョンを揃える必要があるので、別々の PR で来ないようまとめる
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

  # ワークフローはまだ無いが、追加時に設定漏れしないよう先に置く
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
